[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-transforms"
version = "0.1.0"
description = "Rewrites of mbse-schemas models applied step by step, every decision a parameter recorded in certificates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mbse-schemas>=0.28.0,<0.29",
]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[tool.setuptools.package-data]
"mbse.Transforms" = ["skill/*.md"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
]

[tool.uv.sources]
# the sibling checkouts: ../mbse-basis/scripts/polyrepo.py
mbse-schemas = { path = "../../mbse-schemas/python3", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "tutorials"]
addopts = "--nbmake"

[tool.coverage.run]
source = ["mbse.Transforms"]
branch = true
parallel = true
patch = ["subprocess"]
sigterm = true  # a notebook kernel stopped by SIGTERM at shutdown saves its data

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
